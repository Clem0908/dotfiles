[core]
shell=desktop
xwayland=true
backend=drm

[libinput]
enable-tap=true
tap-and-drag=true
tap-and-drag-lock=true
disable-while-taping=true
middle-button-emulation=true
left-handed=true
natural-scroll=true
scroll-method=two-finger

[keyboard]
keymap_model=pc105
keymap_layout=fr
keymap_variant=azerty
numlock-on=true
vt-switching=true

[terminal]
font=Hack
font-size=12
term=xterm-256color
